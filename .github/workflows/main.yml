name: Deploy blog to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - run: node --test tests/blog-ui.test.js
      - run: bundle exec jekyll build
      - name: Check rendered blog controls and post paths
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import re
          blog = Path('_site/blog/index.html').read_text()
          series = Path('_site/series/index.html').read_text()
          admin = Path('_site/admin/index.html').read_text()
          assert 'id="posts-per-page"' in blog
          assert 'id="admin-button"' in blog
          assert 'id="post-form"' in admin
          paths = re.findall(r'data-path="([^"]+)"', blog)
          assert paths and all(path.startswith('_posts/') and path.endswith('.md') for path in paths), paths
          assert 'id="delete-dialog"' in series
          title = '테스트용'
          print('POST_DIAGNOSTIC blog_has_title=', title in blog)
          print('POST_DIAGNOSTIC series_has_title=', title in series)
          print('POST_DIAGNOSTIC rendered_posts=', len(paths))
          print('POST_DIAGNOSTIC source_post=', list(Path('_posts').glob('2026-09-14-*.md')))
          assert title in blog, 'The new post is absent from Jekyll Blog output'
          assert title in series, 'The new post is absent from Jekyll Series output'
          CHECK
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
