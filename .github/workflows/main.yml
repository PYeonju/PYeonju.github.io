name: Deploy blog to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - run: node --test tests/blog-ui.test.js
      - run: bundle exec jekyll build
      - run: python3 tests/check-rendered.py
      - name: Check rendered blog controls and post paths
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import re
          blog = Path('_site/blog/index.html').read_text()
          series = Path('_site/series/index.html').read_text()
          admin = Path('_site/admin/index.html').read_text()
          assert 'id="posts-per-page"' in blog
          assert 'id="admin-button"' in blog
          assert 'id="post-form"' in admin
          paths = re.findall(r'data-path="([^"]+)"', blog)
          assert paths and all(path.startswith('_posts/') and path.endswith('.md') for path in paths), paths
          assert 'id="delete-dialog"' in series
          CHECK
      - name: Install browser test dependencies
        run: |
          npm install --prefix /tmp/blog-browser playwright@1.62.1
          /tmp/blog-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check preview, draft recovery, and toolbar in Chromium
        env:
          PLAYWRIGHT_MODULE: /tmp/blog-browser/node_modules/playwright
        run: node tests/browser.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
