<button type="button" id="admin-button">관리자 권한</button>
<dialog id="admin-dialog" aria-labelledby="admin-dialog-title">
  <form method="dialog" id="admin-form">
    <h2 id="admin-dialog-title">관리자 권한</h2>
    <p>GitHub 토큰으로 저장소 쓰기 권한을 확인합니다. 마지막 입력·클릭 후 30분이 지나면 자동 로그아웃됩니다.</p>
    <label for="github-token">GitHub fine-grained token</label>
    <input id="github-token" type="password" autocomplete="off" required>
    <p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">토큰 만들기</a> · PYeonju.github.io 저장소의 Contents: Read and write</p>
    <p id="admin-status" role="status" aria-live="polite"></p>
    <button type="submit" id="admin-confirm">인증</button>
    <button type="button" id="admin-cancel">취소</button>
  </form>
</dialog>
<script defer src="{{ '/assets/js/admin-link.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
